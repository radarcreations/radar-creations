# Chaque matin : envoie les alertes de la veille aux abonnés, puis met le site à jour.
name: Envoi quotidien

on:
  schedule:
    - cron: "15 5 * * *"   # 7 h 15 à Paris en été, 6 h 15 en hiver
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quotidien
  cancel-in-progress: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alertes + site
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python main.py daily
      - name: Mémoriser le dernier envoi
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Envoi du $(date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
